name: Lesson 41 Tests

on:
  push:
    paths:
      - '.github/workflows/lesson_41_tests.yml'
      - 'lessons/lesson_41/**'
  pull_request:
    paths:
      - '.github/workflows/lesson_41_tests.yml'
      - 'lessons/lesson_41/**'

jobs:
  flutter-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: lessons/lesson_41/app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

      - name: Run integration tests
        run: flutter test integration_test
